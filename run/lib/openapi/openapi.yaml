          properties:
            gasLimit: *id014
            timestamp: *id009
            baseFeePerGas:
              type:
              - string
              - 'null'
        contract:
          type:
          - object
          - 'null'
          description: Contract at the `to` address, when known.
        extraFields:
          type: array
          items: {}
          description: Custom fields configured by the explorer owner (empty by default).
      description: 'Full transaction detail. For an unknown hash the response is `{ "extraFields": [] }`. Additional
        fields may be present; only the fields listed here are part of the documented contract.'
    Block:
      type: object
      properties:
        id: *id010
        number: *id010
        hash:
          $ref: '#/components/schemas/Hash'
        parentHash:
          $ref: '#/components/schemas/Hash'
        timestamp: *id009
        transactionsCount: *id010
        miner:
          type:
          - string
          - 'null'
        gasUsed: *id014
        gasLimit: *id014
        baseFeePerGas:
          type:
          - string
          - 'null'
        difficulty:
          type:
          - string
          - 'null'
        extraData: *id014
        nonce:
          type:
          - string
          - 'null'
        state:
          type: string
          enum:
          - syncing
          - ready
        l1BlockNumber:
          type:
          - integer
          - 'null'
        orbitStatus:
          type: string
          enum:
          - processed_on_rollup
          - pending_on_parent
          - confirmed_on_parent
          - finalized_on_parent
          description: Arbitrum Orbit rollup status.
        workspaceId:
          type: integer
          description: Internal explorer id.
      description: A block as returned in lists. Additional fields may be present; only the fields listed here are
        part of the documented contract.
    BlockDetail:
      type: object
      properties:
        id: *id010
        number: *id010
        hash:
          $ref: '#/components/schemas/Hash'
        parentHash:
          $ref: '#/components/schemas/Hash'
        timestamp: *id009
        transactionsCount: *id010
        miner:
          type:
          - string
          - 'null'
        gasUsed: *id014
        gasLimit: *id014
        baseFeePerGas:
          type:
          - string
          - 'null'
        difficulty:
          type:
          - string
          - 'null'
        extraData: *id014
        syncedTransactionCount:
          type: integer
          description: Number of transactions already indexed with their receipt.
        orbitBatch:
