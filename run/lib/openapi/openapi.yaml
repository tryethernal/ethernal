        to: *id025
        value: *id026
        gasPrice: *id027
        data: *id028
        timestamp: *id009
        workspaceId: *id029
        methodDetails: *id030
        id: *id010
        state: *id031
        transactionIndex:
          type:
          - integer
          - 'null'
        nonce:
          type:
          - integer
          - 'null'
        type:
          type:
          - integer
          - 'null'
        gasLimit: *id014
        gas:
          type: string
        maxFeePerGas:
          type: string
        maxPriorityFeePerGas:
          type: string
        parsedError:
          type:
          - string
          - 'null'
          description: Decoded revert reason for failed transactions.
        tokenTransferCount: *id010
        tokenBalanceChangeCount: *id010
        internalTransactionCount: *id010
        receipt:
          type:
          - object
          - 'null'
          properties:
            gasUsed:
              type:
              - string
              - 'null'
            status:
              type:
              - boolean
              - 'null'
            contractAddress:
              type:
              - string
              - 'null'
            cumulativeGasUsed:
              type:
              - string
              - 'null'
            logCount: *id010
            createdContract:
              oneOf:
              - $ref: '#/components/schemas/CreatedContract'
              - type: 'null'
        block:
          type:
          - object
