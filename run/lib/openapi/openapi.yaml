# Ethernal public explorer API (OpenAPI 3.1).
# Hand-maintained: update it together with the routes (see run/tests/openapi.test.js, which fails on drift).
openapi: 3.1.0
info:
  title: Ethernal Explorer API
  version: 1.0.0
  description: 'Public read API of every Ethernal explorer. The explorer is identified by the domain you call (a
    custom domain or `<slug>.tryethernal.com`); when calling another host (for example `app.tryethernal.com`) pass
    the explorer slug in the `apikey` query parameter. No authentication is required for public explorers.


    Most list endpoints use `page` / `itemsPerPage` pagination. Amounts are decimal strings in the smallest unit
    (wei).


    The Etherscan-compatible endpoints (`/api?module=…&action=…`) are described on `/`.'
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
- url: https://{explorerDomain}/api
  description: Public explorer. Set explorerDomain to the domain of the explorer you want to query.
  variables:
    explorerDomain:
      default: demo.tryethernal.com
tags:
- name: Blocks
  description: Blocks and their transactions.
- name: Transactions
  description: Transactions, logs, token transfers and traces.
- name: Addresses
  description: Per-address activity and balances.
- name: Contracts & tokens
  description: Contracts, verified source, token holders and transfers.
- name: NFTs
  description: ERC-721 collections and tokens.
- name: Search
  description: Free-form search.
- name: Stats
  description: Chain statistics.
- name: Gas
  description: Gas price and usage analytics.
- name: OP Stack
  description: OP Stack rollup data (only on OP Stack explorers).
- name: Arbitrum Orbit
  description: Arbitrum Orbit rollup data (only on Orbit explorers).
- name: Explorer
  description: Explorer configuration and status.
- name: Etherscan-compatible API
  description: Etherscan-style `module`/`action` endpoints on `/api`.
paths:
  /blocks:
    get:
      operationId: listBlocks
      tags:
      - Blocks
      summary: List blocks
      description: Blocks sorted by number.
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - $ref: '#/components/parameters/Page'
      - name: itemsPerPage
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 10
        description: Number of items per page.
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: Sort direction (case-insensitive).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Block'
                required:
                - items
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '404': &id003
          $ref: '#/components/responses/NotFound'
        '500': &id004
          $ref: '#/components/responses/ServerError'
  /blocks/{number}:
    get:
      operationId: getBlock
      tags:
      - Blocks
      summary: Get a block
      description: Returns `null` when the block is not indexed.
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - name: number
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
        description: Block number.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/BlockDetail'
                - type: 'null'
        '400': *id001
        '401': *id002
        '404': *id003
        '500': *id004
  /blocks/{number}/transactions:
    get:
      operationId: listBlockTransactions
      tags:
      - Blocks
      summary: List the transactions of a block
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - name: number
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
        description: Block number.
      - $ref: '#/components/parameters/Page'
      - name: itemsPerPage
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 10
        description: Number of items per page.
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: Sort direction (case-insensitive).
      - name: orderBy
        in: query
        required: false
        schema:
          type: string
          enum:
          - hash
          - timestamp
          - value
          - from
          - to
          default: timestamp
        description: Field to sort by.
      - name: withCount
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'true'
        description: Set to `false` to skip computing `total` (the field is then omitted).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/BlockTransactionListItem'
                  total:
                    type: integer
                    description: Total number of records.
                required:
                - items
        '400': *id001
        '401': *id002
        '404': *id003
        '500': *id004
  /transactions:
    get:
      operationId: listTransactions
      tags:
      - Transactions
      summary: List transactions
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - $ref: '#/components/parameters/Page'
      - name: itemsPerPage
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 10
        description: Number of items per page.
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: Sort direction (case-insensitive).
      - name: orderBy
        in: query
        required: false
        schema:
          type: string
          default: blockNumber
        description: Transaction field to sort by.
      - name: withCount
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          default: 'true'
        description: Set to `false` to skip computing `total` (the field is then omitted).
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransactionListItem'
                  total:
                    type: integer
                    description: Total number of records.
                required:
                - items
        '400': *id001
        '401': *id002
        '404': *id003
        '500': *id004
  /transactions/{hash}:
    get:
      operationId: getTransaction
      tags:
      - Transactions
      summary: Get a transaction
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - &id005
        name: hash
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Hash'
        description: Transaction hash.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetail'
        '400': *id001
        '401': *id002
        '404': *id003
        '500': *id004
  /transactions/{hash}/logs:
    get:
      operationId: listTransactionLogs
      tags:
      - Transactions
      summary: List the event logs of a transaction
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - *id005
      - $ref: '#/components/parameters/Page'
      - name: itemsPerPage
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 20
        description: Number of items per page.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: Total number of logs.
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransactionLog'
                required:
                - count
                - logs
        '400': *id001
        '401': *id002
        '404': *id003
        '500': *id004
  /transactions/{hash}/tokenTransfers:
    get:
      operationId: listTransactionTokenTransfers
      tags:
      - Transactions
      summary: List the token transfers of a transaction
      description: Returns a 500 error with the message `Cannot find transaction` for an unknown hash.
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - *id005
      - $ref: '#/components/parameters/Page'
      - name: itemsPerPage
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 10
        description: Number of items per page.
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: Sort direction (case-insensitive).
      - name: orderBy
        in: query
        required: false
        schema:
          type: string
          default: id
        description: Token transfer field to sort by.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransactionTokenTransfer'
                  total:
                    type: integer
                    description: Total number of records.
                required:
                - items
        '400': *id001
        '401': *id002
        '404': *id003
        '500': *id004
  /transactions/{hash}/tokenBalanceChanges:
    get:
      operationId: listTransactionTokenBalanceChanges
      tags:
      - Transactions
      summary: List the token balance changes of a transaction
      description: Returns a 500 error with the message `Could not find transaction` for an unknown hash.
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - *id005
      - $ref: '#/components/parameters/Page'
      - name: itemsPerPage
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 10
        description: Number of items per page.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TokenBalanceChange'
        '400': *id001
        '401': *id002
        '404': *id003
        '500': *id004
  /transactions/{hash}/traceSteps:
    get:
      operationId: listTransactionTraceSteps
      tags:
      - Transactions
      summary: List the trace steps of a transaction
      description: Returns every step of the trace (no pagination). Empty when the explorer has no tracing.
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - *id005
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TraceStep'
        '400': *id001
        '401': *id002
        '404': *id003
        '500': *id004
  /addresses/{address}/transactions:
    get:
      operationId: listAddressTransactions
      tags:
      - Addresses
      summary: List the transactions sent from or to an address
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - &id006
        name: address
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Address'
        description: Address (case-insensitive).
      - $ref: '#/components/parameters/Page'
      - name: itemsPerPage
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 10
        description: Number of items per page.
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: Sort direction (case-insensitive).
      - name: sortBy
        in: query
        required: false
        schema:
          type: string
          default: blockNumber
        description: Transaction field to sort by.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransactionListItem'
                  total:
                    type: integer
                    description: Total number of records.
                required:
                - items
        '400': *id001
        '401': *id002
        '404': *id003
        '500': *id004
  /addresses/{address}/internalTransactions:
    get:
      operationId: listAddressInternalTransactions
      tags:
      - Addresses
      summary: List the internal transactions involving an address
      description: Only available on explorers with tracing enabled.
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - *id006
      - $ref: '#/components/parameters/Page'
      - name: itemsPerPage
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 50
        description: Number of items per page.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InternalTransaction'
                required:
                - items
        '400': *id001
        '401': *id002
        '404': *id003
        '500': *id004
  /addresses/{address}/tokenTransfers:
    get:
      operationId: listAddressTokenTransfers
      tags:
      - Addresses
      summary: List the token transfers sent or received by an address
      description: Native-token transfers are excluded.
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - *id006
      - $ref: '#/components/parameters/Page'
      - name: itemsPerPage
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 10
        description: Number of items per page.
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: Sort direction (case-insensitive).
      - name: orderBy
        in: query
        required: false
        schema:
          type: string
          default: id
        description: Sort field (`timestamp`, `transactionHash`, `blockNumber`, `amount`, or a token transfer field).
      - name: tokenTypes
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - erc20
            - erc721
            - erc1155
        description: Restrict to these token standards. Send as `tokenTypes[]=erc20`.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AddressTokenTransfer'
                  total:
                    type: integer
                    description: Total number of records.
                required:
                - items
        '400': *id001
        '401': *id002
        '404': *id003
        '500': *id004
  /addresses/{address}/balances:
    get:
      operationId: listAddressTokenBalances
      tags:
      - Addresses
      summary: List the latest token balances of an address
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - *id006
      - name: patterns
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - erc20
            - erc721
        description: Restrict to these token standards. Send as `patterns[]=erc20`.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TokenBalance'
        '400': *id001
        '401': *id002
        '404': *id003
        '500': *id004
  /addresses/{address}/nativeTokenBalance:
    get:
      operationId: getAddressNativeBalance
      tags:
      - Addresses
      summary: Get the native token balance of an address
      description: Read live from the explorer's RPC.
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - *id006
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type:
                    - string
                    - 'null'
                    description: Balance in wei, or null when the RPC is unreachable.
                required:
                - balance
        '400': *id001
        '401': *id002
        '404': *id003
        '500': *id004
  /addresses/{address}/stats:
    get:
      operationId: getAddressStats
      tags:
      - Addresses
      summary: Get statistics of an address
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - *id006
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressStats'
        '400': *id001
        '401': *id002
        '404': *id003
        '500': *id004
  /addresses/{address}/transactionHistory:
    get:
      operationId: getAddressTransactionHistory
      tags:
      - Addresses
      summary: Daily number of transactions of an address
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - *id006
      - &id007
        $ref: '#/components/parameters/From'
      - &id008
        $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    day: &id009
                      type: string
                      format: date-time
                    count:
                      type:
                      - string
                      - integer
        '400': *id001
        '401': *id002
        '404': *id003
        '500': *id004
  /addresses/{address}/tokenTransferHistory:
    get:
      operationId: getAddressTokenTransferHistory
      tags:
      - Addresses
      summary: Daily number of token transfers sent and received by an address
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - *id006
      - *id007
      - *id008
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    day: *id009
                    from_count: &id010
                      type: integer
                    to_count: *id010
        '400': *id001
        '401': *id002
        '404': *id003
        '500': *id004
  /addresses/{address}/spentTransactionFeeHistory:
    get:
      operationId: getAddressSpentTransactionFeeHistory
      tags:
      - Addresses
      summary: Daily transaction fees spent by an address
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - *id006
      - *id007
      - *id008
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    day: *id009
                    transaction_fees:
                      type:
                      - string
                      - integer
                      description: Fees in wei.
        '400': *id001
        '401': *id002
        '404': *id003
        '500': *id004
  /contracts:
    get:
      operationId: listContracts
      tags:
      - Contracts & tokens
      summary: List contracts
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - $ref: '#/components/parameters/Page'
      - name: itemsPerPage
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 10
        description: Number of items per page.
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: Sort direction (case-insensitive).
      - name: orderBy
        in: query
        required: false
        schema:
          type: string
          enum:
          - name
          - address
          - tokenName
          - tokenSymbol
          - tokenTotalSupply
          - timestamp
          default: timestamp
        description: Field to sort by.
      - name: pattern
        in: query
        required: false
        schema:
          type: string
          enum:
          - erc20
          - erc721
        description: Only return contracts of this token standard.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContractListItem'
                required:
                - items
        '400': *id001
        '401': *id002
        '404': *id003
        '500': *id004
  /contracts/verified:
    get:
      operationId: listVerifiedContracts
      tags:
      - Contracts & tokens
      summary: List verified contracts
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - $ref: '#/components/parameters/Page'
      - name: itemsPerPage
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 10
        description: Number of items per page.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/VerifiedContractListItem'
                required:
                - items
        '400': *id001
        '401': *id002
        '404': *id003
        '500': *id004
  /contracts/{address}:
    get:
      operationId: getContract
      tags:
      - Contracts & tokens
      summary: Get a contract
      description: Returns `null` when the contract is unknown.
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - *id006
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ContractDetail'
                - type: 'null'
        '400': *id001
        '401': *id002
        '404': *id003
        '500': *id004
  /contracts/{address}/logs:
    get:
      operationId: listContractLogs
      tags:
      - Contracts & tokens
      summary: List the event logs emitted by a contract
      description: 'Returns `{ "items": [], "total": 0 }` when the contract is unknown.'
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - *id006
      - $ref: '#/components/parameters/Page'
      - name: itemsPerPage
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 10
        description: Number of items per page.
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: Sort direction (case-insensitive).
      - name: orderBy
        in: query
        required: false
        schema:
          type: string
          default: id
        description: Sort field (`timestamp`, `blockNumber` or a log field).
      - name: signature
        in: query
        required: false
        schema:
          type: string
        description: Only return logs whose first topic equals this value.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContractLog'
                required:
                - items
        '400': *id001
        '401': *id002
        '404': *id003
        '500': *id004
  /contracts/{address}/stats:
    get:
      operationId: getContractStats
      tags:
      - Contracts & tokens
      summary: Get statistics of a token contract
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - *id006
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenStats'
        '400': *id001
        '401': *id002
        '404': *id003
        '500': *id004
  /contracts/{address}/holders:
    get:
      operationId: listTokenHolders
      tags:
      - Contracts & tokens
      summary: List the holders of a token
      description: Returns a 500 error when the contract is unknown.
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - *id006
      - $ref: '#/components/parameters/Page'
      - name: itemsPerPage
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 10
        description: Number of items per page.
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: Sort direction (case-insensitive).
      - name: orderBy
        in: query
        required: false
        schema:
          type: string
          enum:
          - address
          - amount
          - share
          default: amount
        description: Field to sort by.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TokenHolder'
                  total:
                    type: integer
